<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Registro amico: la palestra del registro elettronico, con un aiuto in arabo, inglese o italiano semplice.">
<title>Registro amico · la palestra del registro elettronico</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<a class="skip" href="#reg-main">Vai al registro</a>
<a class="skip" href="#coach">Vai all'aiuto</a>

<header class="appbar" id="appbar">
  <p class="brand"><span class="mark" aria-hidden="true">&gt;</span> Registro amico <span class="brand-sub" id="tagline"></span></p>
  <nav class="views" id="views" aria-label="Sezioni"></nav>
  <div class="langs" id="langs" role="group" aria-label="Lingua dell'aiuto">
    <span class="langs-label" id="langs-label">Lingua dell'aiuto</span>
    <button type="button" data-lang="ar" lang="ar" dir="rtl" aria-pressed="false">العربية</button>
    <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
    <button type="button" data-lang="it" lang="it" aria-pressed="false">Italiano semplice</button>
  </div>
</header>

<main id="main">
  <div class="layout" id="practice">
    <section class="register" id="register" lang="it" aria-label="Registro scuola – ambiente di prova">
      <p class="reg-ribbon">Ambiente di prova: dati inventati, niente viene inviato alla scuola.</p>
      <div class="reg-head">
        <svg class="reg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4zm2 2v11a1 1 0 0 0 1 1h9V7a1 1 0 0 0-1-1H7zm2 2h6v2H9V8zm0 4h6v2H9v-2z"/></svg>
        <div class="reg-id">
          <p class="reg-name" id="reg-name">Registro scuola – ambiente di prova</p>
          <p class="reg-school" id="reg-school"></p>
        </div>
        <p class="reg-user" id="reg-user"></p>
      </div>
      <nav class="reg-nav" id="reg-nav" aria-label="Menu del registro"></nav>
      <div class="reg-main" id="reg-main" tabindex="-1"></div>
    </section>

    <aside class="coach" id="coach" tabindex="-1" aria-labelledby="coach-title">
      <div class="coach-head">
        <h2 class="coach-title" id="coach-title"><span class="mark" aria-hidden="true">&gt;</span> <span id="coach-title-text">Il tuo aiuto</span></h2>
        <button type="button" class="coach-toggle" id="coach-toggle" aria-expanded="true" aria-controls="coach-content">Riduci</button>
      </div>
      <div id="coach-content">
        <div id="coach-term"></div>
        <div id="coach-body"></div>
      </div>
      <p class="sr-only" id="coach-live" aria-live="polite" aria-atomic="true"></p>
    </aside>
  </div>

  <section class="fullview" id="fullview" hidden></section>
</main>

<p class="sr-only" id="term-help">Parola del glossario: premi per vedere cosa vuol dire.</p>
<noscript><p class="noscript">Per usare Registro amico serve JavaScript.</p></noscript>
</body>
</html>
